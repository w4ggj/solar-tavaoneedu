name: Deploy solar-cron Worker

on:
  push:
    branches: [main]
    paths:
      - 'workers/solar-cron/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 4f45200ef936f5a6a5c5616acb2ce63b
          workingDirectory: workers/solar-cron
