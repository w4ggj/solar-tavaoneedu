name = "solar-cron"
main = "index.ts"
compatibility_date = "2025-01-01"

[triggers]
crons = ["*/15 * * * *"]

# Replace REPLACE_WITH_* values after creating resources:
#   npx wrangler d1 create solar-history
#   npx wrangler kv:namespace create SOLAR_CACHE

[[d1_databases]]
binding = "DB"
database_name = "solar-history"
database_id = "REPLACE_WITH_DB_ID"

[[kv_namespaces]]
binding = "SOLAR_CACHE"
id = "REPLACE_WITH_KV_ID"
