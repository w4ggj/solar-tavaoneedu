name = "solar-tavaoneedu"
compatibility_date = "2025-01-01"
pages_build_output_dir = "dist"

# After first deploy, replace REPLACE_WITH_* values with real IDs from:
#   npx wrangler d1 create solar-history
#   npx wrangler kv:namespace create SOLAR_CACHE

[[d1_databases]]
binding = "DB"
database_name = "solar-history"
database_id = "REPLACE_WITH_DB_ID"

[[kv_namespaces]]
binding = "SOLAR_CACHE"
id = "REPLACE_WITH_KV_ID"
